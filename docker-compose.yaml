services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zzerp
    container_name: app
    working_dir: /zzerp
    stdin_open: true
    tty: true
    volumes:
      - .:/zzerp
      - frontend_node_modules:/zzerp/frontend/node_modules
    command:
      - /bin/bash
      - -lc
      - pnpm --dir frontend install --frozen-lockfile && exec /bin/bash
    ports:
      - 5173:5173
      - 8000:8000
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_USER: zzerp
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: zzerp

volumes:
  frontend_node_modules:
