name: Rebuild Neon database

on:
  push:
    branches:
      - main
    paths:
      - zzerp.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-database-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild Neon from zzerp.sql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: NEON_DATABASE_URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Rebuild database
        env:
          APP_ENV: production
          ALLOW_DATABASE_RESET: "yes"
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PGOPTIONS: "-c lock_timeout=30s -c statement_timeout=10min"
        run: python scripts/reset_database.py
