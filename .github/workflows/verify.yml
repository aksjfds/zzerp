name: Verify

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zzerp
          POSTGRES_PASSWORD: zzerp
          POSTGRES_DB: zzerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zzerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://zzerp:zzerp@localhost:5432/zzerp
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: PGPASSWORD=zzerp psql -h localhost -U zzerp -d zzerp -f zzerp.sql
      - run: python -m pytest backend/tests -q
      - run: python scripts/check_backend.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend type-check
      - run: pnpm --dir frontend build-only:prod
